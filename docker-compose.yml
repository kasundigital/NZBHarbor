services:
  nzbharbor:
    image: ghcr.io/kasundigital/nzbharbor:edge
    container_name: nzbharbor
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "6789:6789"
    environment:
      NZBHARBOR_CONFIG: /config
      NZBHARBOR_DOWNLOADS: /downloads
    volumes:
      - ./config:/config
      - ./downloads:/downloads
