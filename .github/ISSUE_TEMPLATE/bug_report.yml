name: Bug report
description: Report a reproducible NZBHarbor problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove API keys, Usenet credentials and private/copyrighted NZB data before posting."
  - type: input
    id: version
    attributes:
      label: NZBHarbor version / commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Host OS / architecture / Docker version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Docker/startup, Web UI, NNTP/download, PAR2/RAR, Sonarr/Radarr API, Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include exact steps and expected result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
